<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InvestTracker — Portfolio & Net Worth Intelligence</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Chart.js & Plaid Link -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles.css?v=2.7">
</head>
<body>
  <!-- Global App Container -->
  <div id="app" class="app-layout">
    
    <!-- Top Navigation Bar -->
    <header class="navbar glass-header">
      <div class="nav-left">
        <button id="btn-toggle-sidebar" class="btn-sidebar-toggle" title="Toggle Navigation Panel" aria-label="Toggle Navigation Panel" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="brand" id="brand-logo-btn" style="cursor: pointer;">
          <div class="brand-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 3v18h18" stroke-linecap="round"/>
              <path d="M18 9l-5 5-4-4-6 6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-title">INVEST<span class="highlight">TRACKER</span></span>
          </div>
        </div>
      </div>

      <!-- Right Nav / Controls -->
      <div class="nav-right">
        <!-- Header Sync Status Pill (displayed during daily sync or error, hidden otherwise) -->
        <div id="header-sync-status" class="header-sync-status hidden" aria-live="polite">
          <span class="sync-spinner" id="sync-spinner"></span>
          <span id="sync-status-text" class="sync-status-text">Syncing Accounts</span>
        </div>

        <button id="btn-seed-demo" class="btn btn-secondary" title="Seed Demo Portfolio for Testing">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
          <span>Load Demo Data</span>
        </button>

        <div class="user-menu-wrapper">
          <button id="user-menu-btn" class="user-menu-btn" title="User Menu" type="button">
            <div id="user-avatar" class="avatar">U</div>
            <span id="user-display-name" class="username-text">User</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>

          <div id="user-dropdown" class="user-dropdown glass-card hidden">
            <div class="dropdown-user-info">
              <span class="subtext">Signed in as</span>
              <strong id="dropdown-username" class="dropdown-username-val">User</strong>
            </div>
            <div class="dropdown-divider"></div>
            <button id="btn-open-settings" class="dropdown-item" type="button">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                <polyline points="17 21 17 13 7 13 7 21"/>
                <polyline points="7 3 7 8 15 8"/>
              </svg>
              <span>Database & Backup</span>
            </button>
            <div class="dropdown-divider"></div>
            <button id="btn-logout" class="dropdown-item dropdown-item-danger" type="button">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
              </svg>
              <span>Sign Out</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main App Body (Sidebar + Content) -->
    <div class="app-body">
      <!-- Left Hand Navigation Panel -->
      <aside id="sidebar-panel" class="sidebar-panel glass-sidebar">
        <div class="sidebar-inner">
          <!-- Section 1: Accounts (Flat List with All Accounts selector) -->
          <div class="sidebar-section accounts-sidebar-section">
            <div class="section-title-row">
              <span class="sidebar-section-title">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/></svg>
                Accounts
              </span>
              <span class="sidebar-badge" id="sidebar-accounts-count">0</span>
            </div>

            <!-- "All Accounts" Row -->
            <div id="sidebar-account-all" class="sidebar-account-item active" style="margin-bottom: 0.35rem; cursor: pointer;">
              <div class="account-item-left">
                <span style="margin-right: 0.4rem; font-size: 0.95rem;">🌟</span>
                <div class="account-item-name" style="font-weight: 600;">All Accounts</div>
              </div>
              <div class="account-item-right">
                <div class="account-item-bal" id="sidebar-all-balance" style="font-weight: 600;">
                  $0.00
                </div>
              </div>
            </div>

            <div id="sidebar-accounts-list" class="sidebar-accounts-list">
              <!-- Dynamically populated accounts -->
            </div>
          </div>

          <!-- Section 3: Add Account Button -->
          <div class="sidebar-footer">
            <button id="btn-sidebar-add-account" class="btn btn-secondary btn-block" type="button">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              <span>Add Account</span>
            </button>
          </div>
        </div>
      </aside>

      <!-- Sidebar Mobile Backdrop -->
      <div id="sidebar-backdrop" class="sidebar-backdrop hidden"></div>

      <!-- Dynamic Main Content Area (Mounted by Router) -->
      <div class="content-wrapper">
        <main id="view-container" class="main-content">
          <div style="text-align: center; padding: 4rem 1rem;">
            <h3>Loading InvestTracker...</h3>
          </div>
        </main>
      </div>
    </div>

    <!-- ========================================================================= -->
    <!-- MODALS CONTAINER (Mounted by modals.js) -->
    <!-- ========================================================================= -->
    <div id="modals-container"></div>
  </div>

  <!-- App Modular ES6 Script -->
  <script type="module" src="app.js?v=2.7"></script>
</body>
</html>
